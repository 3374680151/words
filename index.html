<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#818CF8" />
    <meta name="description" content="Qwerty Learner Vue —— 键盘打字练习与单词记忆工具，数据完全保存在本地浏览器。" />
    <title>Qwerty Learner - 打字练习 · 单词记忆</title>

    <!-- 防闪烁：读新 key（isOpenDarkModeAtom，与 Pinia persist 格式一致） -->
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('isOpenDarkModeAtom')
          var dark =
            raw == null
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
              : JSON.parse(raw) === true
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* ignore */
        }
      })()
    </script>

    <!-- GitHub Pages SPA 路由回退（与原项目方案一致） -->
    <script>
      ;(function () {
        var redirect = sessionStorage.getItem('redirect')
        if (redirect && redirect !== location.pathname) {
          history.replaceState(null, '', redirect)
          sessionStorage.removeItem('redirect')
        }
        if (document.location.pathname === '/qwerty-learner-vue/404.html') {
          sessionStorage.setItem('redirect', document.location.pathname.replace('/qwerty-learner-vue/404.html', '/'))
          location.replace('/qwerty-learner-vue/')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>本应用需要启用 JavaScript 才能运行。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
